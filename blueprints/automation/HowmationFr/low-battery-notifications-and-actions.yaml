triggers:
- trigger: state
  entity_id: !input button_entity
  id: t0
- trigger: time
  at: !input time
  id: t1
condition:
- condition: or
  conditions:
  - condition: and
    conditions:
    - condition: trigger
      id: t0
    - '{{ include_button == ''enable_button_trigger'' }}'
  - condition: and
    conditions:
    - condition: trigger
      id: t1
    - '{{ include_time == ''time_enabled'' }}'
- condition: or
  conditions:
  - '{{ include_time == ''time_disabled'' }}'
  - condition: and
    conditions:
    - condition: time
      weekday: !input weekday_options
    - '{{ include_time == ''time_enabled'' }}'
  - condition: trigger
    id: t0
- condition: and
  conditions: !input global_conditions
action:
- choose:
  - alias: Effectuer les actions personnalisées
    conditions:
    - condition: template
      value_template: '{{ include_custom_actions == ''enable_custom_actions'' }}'
    sequence: !input custom_actions
- choose:
  - alias: Utiliser les options de notification facile
    conditions:
    - condition: template
      value_template: '{{ (include_easy_notify == ''enable_easy_notify'') or (include_easy_notify
        == ''enable_easy_okay_notify'') }}'
    - condition: template
      value_template: '{{ notify_device | length > 0 }}'
    sequence:
    - alias: Envoyer une notification à chaque appareil
      repeat:
        for_each: !input notify_device
        sequence:
        - choose:
          - alias: Des capteurs ont été trouvés
            conditions:
            - '{{ easy_notify_message != '''' }}'
            sequence:
            - choose:
              - alias: Notification facile sans bouton d'action
                conditions:
                - '{{ notify_action_buttons == ''disabled_notify_action_buttons''
                  }}'
                sequence:
                - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') |
                    slugify }}
                  data:
                    title: !input notify_title
                    message: '{{easy_notify_message}}'
                    data: '{{ device_message_data }}'
              - alias: Notification facile avec bouton d'action
                conditions:
                - '{{ notify_action_buttons != ''disabled_notify_action_buttons''
                  }}'
                sequence:
                - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') |
                    slugify }}
                  data:
                    title: !input notify_title
                    message: '{{easy_notify_message}}'
                    data: '{{ device_message_data_action_button }}'
          - alias: Aucun capteur n'a été trouvé
            conditions:
            - '{{ easy_notify_message == '''' }}'
            - '{{ include_easy_notify == ''enable_easy_okay_notify'' }}'
            sequence:
            - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify
                }}
              data:
                title: !input notify_title
                message: !input notify_okay_message
                data: '{{ device_message_data }}'
- choose:
  - alias: Utiliser les options de notification persistante facile
    conditions:
    - condition: template
      value_template: '{{ (include_persistent_notification == ''enable_persistent_notification'')
        or (include_persistent_notification == ''enable_persistent_okay_notification'')
        }}'
    sequence:
    - choose:
      - alias: Des capteurs ont été trouvés
        conditions:
        - '{{ easy_notify_message != '''' }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: "\U0001FAAB {{notify_title}}"
            message: '{{easy_notify_message}}'
      - alias: Aucun capteur n'a été trouvé
        conditions:
        - '{{ easy_notify_message == '''' }}'
        - '{{ include_persistent_notification == ''enable_persistent_okay_notification''
          }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: "\U0001FAAB {{notify_title}}"
            message: !input notify_okay_message
- choose:
  - alias: Vérifier si le bouton d'action Liste de Tâches est activé
    conditions:
    - condition: template
      value_template: '{{ (include_easy_notify == ''enable_easy_notify'') or (include_easy_notify
        == ''enable_easy_okay_notify'') }}'
    - condition: template
      value_template: '{{(notify_action_buttons == ''enable_to_do_list_button'') or
        (notify_action_buttons == ''enable_to_do_list_button_and_confirmation'')}}'
    - condition: template
      value_template: '{{ notify_device | length > 0 }}'
    sequence:
    - alias: Attendre une réponse des boutons d'action
      wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_button_to_do }}'
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: '{{ action_button_cancel }}'
    - choose:
      - alias: Vérifier si le message de confirmation est désactivé
        conditions:
        - condition: template
          value_template: '{{ notify_action_buttons == ''enable_to_do_list_button''
            }}'
        sequence:
        - if:
          - alias: Confirmation des boutons d'action
            condition: template
            value_template: '{{ wait.trigger.idx is defined }}'
          then:
          - alias: Effectuer les actions choisies
            choose:
            - conditions: '{{ wait.trigger.event.data.action == action_button_to_do
                }}'
              sequence:
              - alias: Ajouter tâche à la liste de tâches
                action: todo.add_item
                metadata: {}
                data:
                  item: !input to_do_task_title
                  description: '{{easy_notify_message}}'
                target:
                  entity_id: !input to_do_list
            - conditions: '{{ wait.trigger.event.data.action == action_button_cancel
                }}'
              sequence:
              - stop: Arrêter l'automatisation
      - alias: Vérifier si le message de confirmation est activé
        conditions:
        - condition: template
          value_template: '{{ notify_action_buttons == ''enable_to_do_list_button_and_confirmation''
            }}'
        sequence:
        - if:
          - alias: Confirmation des boutons d'action
            condition: template
            value_template: '{{ wait.trigger.idx is defined }}'
          then:
          - alias: Effectuer les actions choisies
            choose:
            - conditions: '{{ wait.trigger.event.data.action == action_button_to_do
                }}'
              sequence:
              - alias: Ajouter tâche à la liste de tâches
                action: todo.add_item
                metadata: {}
                data:
                  item: !input to_do_task_title
                  description: '{{easy_notify_message}}'
                target:
                  entity_id: !input to_do_list
              - alias: Envoyer une notification à chaque appareil
                repeat:
                  for_each: !input notify_device
                  sequence:
                  - action: notify.mobile_app_{{ device_attr(repeat.item, 'name')
                      | slugify }}
                    data:
                      title: !input action_button_confirmation_title
                      message: !input action_button_confirmation_message
                      data: '{{ device_confirmation_message_data }}'
            - conditions: '{{ wait.trigger.event.data.action == action_button_cancel
                }}'
              sequence:
              - alias: Envoyer une notification à chaque appareil
                repeat:
                  for_each: !input notify_device
                  sequence:
                  - action: notify.mobile_app_{{ device_attr(repeat.item, 'name')
                      | slugify }}
                    data:
                      title: !input action_button_confirmation_title
                      message: !input cancel_action_button_confirmation_message
                      data: '{{ device_message_data }}'
