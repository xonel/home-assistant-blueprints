blueprint:
  name: Notifications et Actions pour Batterie Faible
  description: "# \U0001FAAB Notifications et Actions pour Batterie Faible\n\n⚠️ Ceci
    est une traduction de **Howmation** de la blueprint « [Low Battery Notifications
    & Actions](https://community.home-assistant.io/t/low-battery-notifications-actions/653754)
    » originalement conçue par **Blacky**.\n\n**Version: 2.9**\n\n\U0001F680 Restez
    chargé, restez connecté ! Automatisons et prenons le contrôle de la maintenance
    de vos batteries !\U0001F50B⚡\n\n**Si vous aimez mes blueprints et souhaitez montrer
    votre soutien ou simplement dire merci ?** [Cliquez Ici](https://www.paypal.com/donate/?hosted_button_id=WAZS3QSDTPGA8)
    \U0001F642 (donation pour Blacky)\n\n<details> <summary><b>Le Processus d'Automatisation
    :</b> \U0001F448</summary>\n\n  - **Options de Déclenchement :**\n    - **Assistant
    Bouton :** Appuyez sur un bouton dans l'interface utilisateur (IU) pour vérifier
    les niveaux de batterie.\n    - **Heure et Jour :** Vérifie automatiquement et
    périodiquement les niveaux de batterie à une heure et un jour donnés.\n\n  - **Capteurs
    de Batterie :**\n    - Détecte automatiquement tous les capteurs de batterie utilisés
    dans Home Assistant.\n    - Définit un pourcentage d'avertissement de batterie
    faible pour identifier toutes les batteries en dessous de ce niveau.\n    - Détecte
    les batteries Faibles, indisponibles et inconnues.\n    - Exclut des capteurs
    de batterie spécifiques des notifications.\n    - Crée un groupe personnalisé
    de capteurs de batterie avec son propre pourcentage d'avertissement de batterie
    faible indépendant.\n\n  - **Options de Notification :**\n    - Option d'envoyer
    des messages à un ou plusieurs appareils.\n    - Option d'afficher vos notifications
    directement dans l'interface utilisateur de Home Assistant (IU).\n    - Choisissez
    quels capteurs de batterie utiliser, puis sélectionnez leurs états parmi trois
    messages prédéfinis :\n        - Niveau % Batterie Faible + Niveau Batterie Faible
    + Indisponible + Inconnu.\n        - Niveau % Batterie Faible et Niveau Batterie
    Faible.\n        - Capteurs Indisponibles ou Inconnus.\n    - Option de recevoir
    un message de confirmation si toutes les batteries sont correctes.\n    - Option
    d'utiliser des boutons d'action dans votre notification d'appareil qui vous permet
    d'ajouter vos batteries faibles à une liste de tâches.\n    - Compatible avec
    les appareils Apple iOS et Android.\n\n  - **Actions Personnalisées :**\n    -
    Personnalisez les actions selon vos préférences et besoins, améliorant la fonctionnalité
    des automatisations.\n    - Utilisez 10 capteurs de batterie prédéterminés personnalisés
    dans la blueprint pour des actions plus adaptées et précises.\n    - Configurez
    des actions personnalisées pour inclure des fonctionnalités comme la personnalisation
    des notifications ou la lecture d'annonces sur des plateformes comme The Voice
    (HA), Google, Alexa, TTS, etc.\n\n  - **Conditions Personnalisées :**\n    - Entrez
    toutes conditions personnalisées pour personnaliser davantage le processus d'automatisation.\n</details>\n\nBesoin
    d'aide ? \n- FAQ : [Cliquez Ici](https://community.home-assistant.io/t/653754/2?u=blacky)\n-
    Support Communautaire Incluant les Mises à Jour : [Cliquez Ici](https://community.home-assistant.io/t/653754)\n\nRequis
    = *\n"
  domain: automation
  input:
    trigger_settings:
      name: Déclencheurs *
      icon: mdi:cog-outline
      description: 'Vous devez sélectionner au moins un déclencheur *

        '
      collapsed: true
      input:
        include_button:
          name: Utiliser le Déclencheur Assistant Bouton (Optionnel)
          description: 'Sélectionnez si vous souhaitez qu''un assistant bouton déclenche
            l''automatisation. C''est utile si vous voulez vérifier les niveaux de
            batterie en appuyant sur un bouton dans l''IU.


            Pour plus d''informations sur la création d''un assistant bouton [Cliquez
            Ici](https://community.home-assistant.io/t/653754/4)

            '
          default: disable_button_trigger
          selector:
            select:
              options:
              - label: Utiliser un déclencheur bouton
                value: enable_button_trigger
              - label: Ne pas utiliser de déclencheur bouton
                value: disable_button_trigger
              sort: false
              multiple: false
              custom_value: false
        button_entity:
          name: Assistant Bouton
          description: 'Saisissez votre assistant bouton.

            '
          default: []
          selector:
            entity:
              filter:
              - domain:
                - input_button
              multiple: false
        include_time:
          name: Utiliser le Déclencheur Temporel (Optionnel)
          description: 'Sélectionnez si vous souhaitez utiliser le déclencheur temporel.
            C''est utile si vous voulez vérifier périodiquement les niveaux de batterie
            à une heure et un jour donnés.

            '
          default: time_disabled
          selector:
            select:
              options:
              - label: Activer les options temporelles
                value: time_enabled
              - label: Désactiver les options temporelles
                value: time_disabled
              sort: false
              multiple: false
              custom_value: false
        time:
          name: Heure
          description: 'Définissez l''heure à laquelle vous souhaitez exécuter l''automatisation.

            '
          default: 00:00:00
          selector:
            time: {}
        weekday_options:
          name: Jours de la Semaine
          description: 'Sélectionnez les jours de la semaine où vous souhaitez que
            l''automatisation s''exécute.

            '
          default:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
          selector:
            select:
              multiple: true
              mode: list
              options:
              - label: Lundi
                value: mon
              - label: Mardi
                value: tue
              - label: Mercredi
                value: wed
              - label: Jeudi
                value: thu
              - label: Vendredi
                value: fri
              - label: Samedi
                value: sat
              - label: Dimanche
                value: sun
              sort: false
              custom_value: false
    battery_settings:
      name: Paramètres de Batterie
      icon: mdi:battery-alert-variant-outline
      collapsed: true
      input:
        battery_level:
          name: Niveau d'Avertissement Batterie Faible
          description: 'Définissez le pourcentage d''avertissement de batterie faible
            pour identifier toutes les batteries en dessous de ce niveau.

            '
          default: 20
          selector:
            number:
              min: 1.0
              max: 100.0
              step: 1.0
              unit_of_measurement: '%'
              mode: slider
        exclude_sensors:
          name: Capteurs de Batterie Exclus (Optionnel)
          description: 'Choisissez les capteurs de batterie à exclure lors de l''exécution
            de l''automatisation. L''automatisation tentera de détecter tous les capteurs
            de batterie utilisés dans Home Assistant, y compris ceux de vos téléphones,
            tablettes, etc. Cependant, il n''est pas toujours nécessaire ou souhaitable
            de surveiller ces batteries. Sélectionner ces batteries ici les exclura
            de vos notifications.


            **NOTE** - Vous pouvez seulement utiliser des entités et des étiquettes.
            Les zones et appareils ne sont pas supportés.

            '
          default:
            entity_id: []
          selector:
            target:
              entity:
              - device_class:
                - battery
        custom_group:
          name: Capteurs de Batterie - Groupe Personnalisé (Optionnel)
          description: 'Vous pouvez sélectionner un groupe personnalisé de capteurs
            de batterie à inclure dans vos notifications. Ce groupe personnalisé a
            son propre paramètre indépendant ''Niveau d''Avertissement Batterie Faible''
            ci-dessous. Lors de l''utilisation de toutes les batteries avec le groupe
            personnalisé dans une seule automatisation, il est recommandé d''exclure
            le groupe personnalisé de batteries spécifié ci-dessus dans la section
            ''Capteurs de Batterie Exclus''.


            Les capteurs de batterie exclus ne sont pas liés à ce groupe personnalisé.


            **NOTE** - Vous pouvez seulement utiliser des entités et des étiquettes.
            Les zones et appareils ne sont pas supportés.

            '
          default:
            entity_id: []
          selector:
            target:
              entity:
              - device_class:
                - battery
        custom_group_battery_level:
          name: Groupe Personnalisé - Niveau d'Avertissement Batterie Faible
          description: 'Définissez le pourcentage d''avertissement de batterie faible
            pour identifier toutes les batteries en dessous de ce niveau.

            '
          default: 20
          selector:
            number:
              min: 1.0
              max: 100.0
              step: 1.0
              unit_of_measurement: '%'
              mode: slider
    easy_notify_settings:
      name: Notification Facile
      icon: mdi:bell-check-outline
      collapsed: true
      input:
        include_easy_notify:
          name: Utiliser la Notification Facile - Options de Notification d'Appareil
            (Optionnel)
          description: 'Activer cette option enverra des notifications aux appareils
            sélectionnés ci-dessous. Elle vous permet de choisir quels capteurs de
            batterie utiliser, puis de sélectionner leurs états parmi trois messages
            prédéfinis. Vous pouvez également choisir de recevoir un message de confirmation
            si toutes les batteries sont correctes. Pour une personnalisation plus
            poussée ou pour intégrer avec des assistants vocaux comme HA, Google,
            Alexa, TTS, etc., veuillez explorer les options d''action personnalisées
            ci-dessous.

            '
          default: disabled_easy_notify
          selector:
            select:
              options:
              - label: Activer la Notification d'Appareil
                value: enable_easy_notify
              - label: Activer la Notification d'Appareil + Message de Confirmation
                  OK
                value: enable_easy_okay_notify
              - label: Désactiver la Notification d'Appareil
                value: disabled_easy_notify
              sort: false
              multiple: false
              custom_value: false
        include_persistent_notification:
          name: Utiliser la Notification Facile - Options de Notification IU (Optionnel)
          description: 'Activer cette option affichera les notifications directement
            dans l''interface utilisateur de Home Assistant (IU). Elle vous permet
            de choisir quels capteurs de batterie utiliser, puis de sélectionner leurs
            états parmi trois messages prédéfinis. Vous pouvez également choisir de
            recevoir un message de confirmation dans l''IU si toutes les batteries
            sont correctes. Pour une personnalisation plus poussée ou pour intégrer
            avec des assistants vocaux comme HA, Google, Alexa, TTS, etc., veuillez
            explorer les options d''action personnalisées ci-dessous.

            '
          default: disabled_persistent_notification
          selector:
            select:
              options:
              - label: Activer la Notification IU
                value: enable_persistent_notification
              - label: Activer la Notification IU + Message de Confirmation OK
                value: enable_persistent_okay_notification
              - label: Désactiver la Notification IU
                value: disabled_persistent_notification
              sort: false
              multiple: false
              custom_value: false
        sensor_selection:
          name: Sélection de Capteurs
          description: 'Veuillez sélectionner quels capteurs vous souhaitez inclure
            dans vos notifications.

            '
          default: enable_all_sensors
          selector:
            select:
              options:
              - label: Utiliser les Capteurs de Batterie - Groupe Personnalisé
                value: enable_battery_sensors_custom_group
              - label: Utiliser Tous les Capteurs de Batterie Moins les Capteurs de
                  Batterie Exclus
                value: enable_all_sensors
              - label: Utiliser Tous les Capteurs de Batterie Moins les Capteurs de
                  Batterie Exclus + Groupe Personnalisé
                value: enable_all_and_custom_group_sensors
              sort: false
              multiple: false
              custom_value: false
        notify_device:
          name: Appareils Notifiés (Optionnel)
          description: 'Si vous avez activé les notifications d''appareil ci-dessus,
            veuillez sélectionner les appareils pour recevoir les notifications.

            '
          default: []
          selector:
            device:
              filter:
              - integration: mobile_app
              multiple: true
        notify_title:
          name: Titre
          description: 'Entrez le titre de notification de votre message.

            '
          default: Notification Batterie Faible
          selector:
            text: {}
        notify_message:
          name: Message
          description: 'Choisissez un des trois messages prédéfinis dans le menu déroulant.


            **1 - Niveau % Batterie Faible + Niveau Batterie Faible + Indisponible
            + Inconnu** Inclut les capteurs avec des pourcentages de batterie en dessous
            du niveau d''avertissement faible, dans un état de batterie faible, ou
            marqués comme indisponibles ou inconnus.


            **2 - Niveau % Batterie Faible et Niveau Batterie Faible** Inclut les
            capteurs avec des pourcentages de batterie en dessous du niveau d''avertissement
            faible ou dans un état de batterie faible.


            **3 - Capteurs Indisponibles ou Inconnus** Inclut les capteurs qui sont
            indisponibles ou ont un état inconnu.

            '
          default: all_sensors
          selector:
            select:
              mode: dropdown
              options:
              - label: 1 - Niveau % Batterie Faible + Niveau Batterie Faible + Indisponible
                  + Inconnu
                value: all_sensors
              - label: 2 - Niveau % Batterie Faible et Niveau Batterie Faible
                value: sensors
              - label: 3 - Capteurs Indisponibles ou Inconnus
                value: unavailable_sensors
              sort: false
              multiple: false
              custom_value: false
        notify_okay_message:
          name: Message de Confirmation OK
          description: 'Entrez le message de notification que vous souhaitez recevoir
            quand toutes vos batteries sont correctes.

            '
          default: OUI ! Toutes les batteries sont correctes :)
          selector:
            text: {}
        notify_interruption_level:
          name: Niveau d'Interruption - iOS Seulement
          description: 'Sur les appareils exécutant iOS 15 et ultérieur, vous pouvez
            configurer le niveau d''interruption pour vos notifications pour vous
            assurer qu''elles sont livrées selon vos préférences. Choisissez le niveau
            d''interruption désiré dans la liste déroulante. Les notifications critiques
            et sensibles au temps doivent être activées dans l''App Home Assistant,
            et les notifications sensibles au temps doivent être autorisées dans vos
            paramètres Focus.


            Pour plus d''informations sur les niveaux d''interruption [Cliquez Ici](https://community.home-assistant.io/t/653754/192?u=blacky)

            '
          default: active
          selector:
            select:
              mode: dropdown
              options:
              - label: Par Défaut
                value: active
              - label: Notifications Critiques
                value: critical
              - label: Notifications Sensibles au Temps
                value: time-sensitive
              - label: Notifications Silencieuses Sans Réveil d'Écran
                value: passive
              sort: false
              multiple: false
              custom_value: false
        notify_sound:
          name: Son de Notification - iOS Seulement
          description: 'L''app Home Assistant pour iOS inclut des sons de notification
            intégrés, et vous pouvez importer des sons depuis votre appareil iOS dans
            l''app. Des sons personnalisés peuvent également être ajoutés via iTunes
            ou depuis votre stockage cloud. Lors de la saisie d''un son, assurez-vous
            d''utiliser le nom de fichier complet, incluant l''extension.


            Pour plus d''informations sur l''utilisation des sons dans l''app Home
            Assistant, [Cliquez Ici](https://community.home-assistant.io/t/653754/192?u=blacky)

            '
          default: []
          selector:
            text: {}
        notify_data:
          name: Options Android Seulement (Optionnel)
          description: 'Les notifications **Haute Priorité** s''assurent que vous
            recevez les alertes importantes immédiatement. Ces notifications contournent
            les délais de livraison normaux et sont livrées instantanément à votre
            appareil.


            Les **Notifications Collantes** s''assurent que les alertes importantes
            ne sont pas supprimées quand sélectionnées. Elles restent sur votre écran
            de notification jusqu''à ce que vous les effaciez ou les balayiez activement,
            garantissant que les informations critiques restent visibles jusqu''à
            ce qu''elles soient traitées.


            Le **Canal de Notification** vous permet d''organiser facilement différents
            paramètres de notification, incluant les sons de notification, vibrations,
            et autres fonctionnalités spécifiques à l''appareil. Si vous choisissez
            cette option, veuillez entrer le nom de canal désiré ci-dessous.

            '
          default: []
          selector:
            select:
              multiple: true
              options:
              - label: Haute Priorité
                value: high_priority
              - label: Notification Collante
                value: sticky
              - label: Canal de Notification
                value: channel
              sort: false
              custom_value: false
        notify_channel:
          name: Canal de Notification - Android Seulement
          description: 'Si vous avez choisi d''utiliser un canal de notification,
            entrez simplement le nom d''un canal existant pour appliquer ses paramètres
            pré-configurés. Si vous n''avez pas encore de canal, vous pouvez en créer
            un nouveau en entrant un nom ici. Quand votre automatisation envoie la
            première notification, elle créera le canal sur votre appareil. Après
            la création du canal, vous pouvez personnaliser ses paramètres de notification
            selon votre préférence directement sur votre appareil.


            Pour plus d''informations sur les canaux de notification [Cliquez Ici](https://community.home-assistant.io/t/653754/192?u=blacky)

            '
          default: []
          selector:
            text: {}
    action_buttons_settings:
      name: Boutons d'Action
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        notify_action_buttons:
          name: Notification Facile - Boutons d'Action (Optionnel)
          description: 'Améliorez vos notifications d''appareil avec une fonctionnalité
            de bouton de liste de tâches actionnable. Avec juste un maintien, relâchement
            et tap, ajoutez sans effort les éléments sélectionnés de votre notification
            de batterie faible à n''importe quelle de vos listes de tâches choisies.  De
            plus, pour une assurance supplémentaire, vous pouvez choisir de recevoir
            un message de confirmation confirmant l''action.

            '
          default: disabled_notify_action_buttons
          selector:
            select:
              options:
              - label: Ajouter des Boutons d'Action Liste de Tâches
                value: enable_to_do_list_button
              - label: Ajouter des Boutons d'Action Liste de Tâches + Message de Confirmation
                value: enable_to_do_list_button_and_confirmation
              - label: Désactiver les Boutons d'Action
                value: disabled_notify_action_buttons
              sort: false
              multiple: false
              custom_value: false
        to_do_list:
          name: Boutons d'Action Notification Facile - Sélection de Liste de Tâches
          description: 'Choisissez la liste de tâches où vous souhaitez ajouter votre
            tâche.


            **Note** - La liste de courses par défaut n''est pas compatible en raison
            de son manque de capacité de description.  Cependant, toutes les autres
            listes de tâches sont entièrement supportées.

            '
          default: []
          selector:
            entity:
              filter:
              - domain:
                - todo
              multiple: false
        to_do_task_title:
          name: Boutons d'Action Notification Facile - Titre de Tâche
          description: 'Quand le bouton d''action est pressé, il ajoutera une tâche
            à votre liste de tâches choisie. Veuillez entrer le titre que vous souhaitez
            pour votre tâche de liste de tâches

            '
          default: Batteries à Remplacer
          selector:
            text: {}
        action_button_to_do:
          name: Boutons d'Action Notification Facile - Bouton d'Action
          description: 'Veuillez spécifier le nom pour le bouton d''action à afficher
            dans la notification. Quand pressé, ce bouton ajoute sans effort une tâche
            à votre liste de tâches choisie.

            '
          default: Ajouter à la Liste de Tâches !
          selector:
            text: {}
        action_button_cancel:
          name: Boutons d'Action Notification Facile - Bouton Annuler
          description: 'Veuillez spécifier le nom pour le bouton annuler à afficher
            dans la notification. Ce bouton vous permet d''annuler le processus d''ajout
            de tâche.

            '
          default: Annuler
          selector:
            text: {}
        action_button_confirmation_title:
          name: Boutons d'Action Notification Facile - Titre de Confirmation Bouton
            d'Action et Annuler
          description: 'Veuillez entrer un titre pour le message de notification de
            confirmation quand un bouton d''action ou un bouton annuler est pressé.

            '
          default: Confirmation Batterie Faible
          selector:
            text: {}
        action_button_confirmation_message:
          name: Boutons d'Action Notification Facile - Message de Confirmation Bouton
            d'Action
          description: 'Veuillez entrer le message pour le message de notification
            de confirmation quand le bouton d''action est pressé.

            '
          default: Vos batteries faibles ont été ajoutées à votre liste de tâches
          selector:
            text: {}
        cancel_action_button_confirmation_message:
          name: Boutons d'Action Notification Facile - Message de Confirmation Bouton
            Annuler
          description: 'Veuillez entrer le message pour le message de notification
            de confirmation quand le bouton annuler est pressé.

            '
          default: Annulé - Rien n'a été ajouté à votre liste de tâches
          selector:
            text: {}
    custom_actions_settings:
      name: Actions Personnalisées
      icon: mdi:code-tags
      collapsed: true
      input:
        include_custom_actions:
          name: Utiliser les Options d'Action Personnalisées (Optionnel)
          description: 'Vous pouvez ajouter toutes actions personnalisées que vous
            souhaitez exécuter quand l''automatisation est déclenchée. Cela peut inclure
            la personnalisation des notifications ou la lecture d''annonces sur des
            plateformes comme The Voice (HA), Google, Alexa, TTS, etc.

            '
          default: disabled_custom_actions
          selector:
            select:
              options:
              - label: Activer les Actions Personnalisées
                value: enable_custom_actions
              - label: Désactiver les Actions Personnalisées
                value: disabled_custom_actions
              sort: false
              multiple: false
              custom_value: false
        custom_actions:
          name: Actions Personnalisées
          description: 'Ajoutez vos actions personnalisées que vous souhaitez exécuter
            quand l''automatisation est déclenchée. Ci-dessous se trouvent 10 capteurs
            que vous pouvez inclure dans vos actions, selon vos préférences.


            **Tous les Capteurs de Batterie Moins les Exclus**

            1 - Utilisez "{{all_sensors}}" pour - Niveau % Batterie Faible + Niveau
            Batterie Faible + Indisponible + Inconnu.

            2 - Utilisez "{{sensors}}" pour - Niveau % Batterie Faible et Niveau Batterie
            Faible.

            3 - Utilisez "{{unavailable_sensors}}" pour - Capteurs Indisponibles ou
            Inconnus.

            4 - Utilisez "{{sensors_names}}" pour - Niveau % Batterie Faible et Niveau
            Batterie Faible - Nom de capteur seulement.

            5 - Utilisez "{{unavailable_sensors_names}}" pour - Capteurs Indisponibles
            ou Inconnus - Nom de capteur seulement.


            **Capteurs de Batterie - Groupe Personnalisé**

            1 - Utilisez "{{all_sensors_custom_group}}" pour - Niveau % Batterie Faible
            + Niveau Batterie Faible + Indisponible + Inconnu.

            2 - Utilisez "{{sensors_custom_group}}" pour - Niveau % Batterie Faible
            et Niveau Batterie Faible.

            3 - Utilisez "{{unavailable_sensors_custom_group}}" pour - Capteurs Indisponibles
            ou Inconnus.

            4 - Utilisez "{{sensors_names_custom_group}}" pour - Niveau % Batterie
            Faible et Niveau Batterie Faible - Nom de capteur seulement.

            5 - Utilisez "{{unavailable_sensors_names_custom_group}}" pour - Capteurs
            Indisponibles ou Inconnus - Nom de capteur seulement.


            Pour plus d''informations sur l''utilisation de ces capteurs dans vos
            actions [Cliquez Ici](https://community.home-assistant.io/t/653754/21)

            '
          default: []
          selector:
            action: {}
    global_conditions_settings:
      name: Conditions Globales
      icon: mdi:earth
      collapsed: true
      input:
        global_conditions:
          name: Conditions Globales
          description: 'Entrez toutes conditions globales que vous souhaitez appliquer
            à l''automatisation.

            '
          default: []
          selector:
            condition: {}
  source_url: https://github.com/HowmationFr/HA_Blueprints/blob/main/Automations/low-battery-notifications-and-actions.yaml
mode: restart
max_exceeded: silent
variables:
  include_button: !input include_button
  button_entity: !input button_entity
  include_time: !input include_time
  time: !input time
  weekday_options: !input weekday_options
  battery_level: !input battery_level
  exclude_sensors: !input exclude_sensors
  custom_group: !input custom_group
  custom_group_battery_level: !input custom_group_battery_level
  include_easy_notify: !input include_easy_notify
  include_persistent_notification: !input include_persistent_notification
  sensor_selection: !input sensor_selection
  notify_device: !input notify_device
  notify_title: !input notify_title
